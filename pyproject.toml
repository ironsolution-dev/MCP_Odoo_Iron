[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-mcp-v2"
version = "0.1.0"
description = "MCP Odoo APL 2.0 multiusuario (Blue/Green)"
requires-python = ">=3.12"
dependencies = [
  # mcp==1.27.1: SDK oficial (provee mcp.server.fastmcp). NUNCA "fastmcp" (paquete
  # tercero distinto): con el build v0.4.0 causo ModuleNotFoundError y crash-loop
  # en GREEN (18-ago-2026). Pin exacto = lo que corria la imagen v0.3.5 sana.
  "mcp==1.27.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "requires_blue: tests que requieren endpoint BLUE accesible (se omiten en CI local)",
  "requires_odoo: tests que requieren conexion live a Odoo",
]
